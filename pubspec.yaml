name: calamansi_care
description: CalamansiCare mobile UI for AI-based calamansi disease detection, treatment recommendation, and barangay reporting.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  image: ^4.3.0
  tflite_flutter: ^0.12.1
  sqflite: ^2.4.2
  path: ^1.9.0
  supabase_flutter: ^2.12.0
  # image_picker: ^1.1.2
  # camera: ^0.11.0+1
  # connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Put the exported TensorFlow Lite model at this path. See assets/README.md.
    - assets/model.tflite
