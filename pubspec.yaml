name: calamansi_care
description: CalamansiCare mobile UI for AI-based calamansi disease detection, treatment recommendation, and barangay reporting.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  image: ^4.3.0
  tflite_flutter: ^0.12.1
  sqflite: ^2.4.2
  path: ^1.9.0
  crypto: ^3.0.7
  supabase_flutter: ^2.12.0
  connectivity_plus: ^7.3.2
  device_info_plus: ^13.3.0
  flutter_secure_storage: 10.3.4
  path_provider: 2.1.5
  camera: ^0.12.1
  sticky_headers: ^0.3.0+2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.3
  flutter_secure_storage_platform_interface: ^2.1.1
  shared_preferences: ^2.5.5

flutter:
  uses-material-design: true
  fonts:
    - family: FlaticonProfile
      fonts:
        - asset: assets/fonts/FlaticonProfile.ttf
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville.ttf
  assets:
    - assets/google-g.png
    # Put the exported TensorFlow Lite model at this path. See assets/README.md.
    - assets/model.tflite
